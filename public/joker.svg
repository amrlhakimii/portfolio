<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="Jester juggling a camera, code, a pen nib and a shield">
  <rect width="300" height="420" fill="#0a1a33"/>
  <rect x="10" y="10" width="280" height="400" rx="10" fill="none" stroke="#d2b06a" stroke-width="2"/>
  <ellipse cx="150" cy="195" rx="128" ry="112" fill="none" stroke="#d2b06a" stroke-width="1.5" stroke-dasharray="3 7" opacity=".5"/>

  <!-- body -->
  <path d="M78 420 L90 285 L210 285 L222 420 Z" fill="#ef0107"/>
  <g fill="#0a1a33" stroke="#d2b06a" stroke-width="1.5">
    <path d="M150 303 l14 22 -14 22 -14 -22z"/>
    <path d="M116 345 l12 19 -12 19 -12 -19z"/>
    <path d="M184 345 l12 19 -12 19 -12 -19z"/>
  </g>

  <!-- ruff collar -->
  <path d="M95 270 L107 254 L119 270 L131 254 L143 270 L155 254 L167 270 L179 254 L191 270 L203 254 L205 284 L95 284 Z" fill="#f6f3ec" stroke="#0a1a33" stroke-width="2" stroke-linejoin="round"/>

  <!-- hat -->
  <path d="M102 168 C80 150 62 120 55 85 C85 105 115 115 135 125 L135 168 Z" fill="#ef0107"/>
  <path d="M198 168 C220 150 238 120 245 85 C215 105 185 115 165 125 L165 168 Z" fill="#d2b06a"/>
  <path d="M135 125 C135 95 145 70 150 50 C155 70 165 95 165 125 L165 168 L135 168 Z" fill="#f6f3ec"/>
  <rect x="100" y="160" width="100" height="18" rx="3" fill="#ef0107" stroke="#0a1a33" stroke-width="2"/>
  <g fill="#d2b06a" stroke="#0a1a33" stroke-width="1.5">
    <circle cx="55" cy="85" r="8"/><circle cx="150" cy="50" r="8"/><circle cx="245" cy="85" r="8"/>
  </g>
  <g fill="#f6f3ec" opacity=".8"><circle cx="52" cy="82" r="2"/><circle cx="147" cy="47" r="2"/><circle cx="242" cy="82" r="2"/></g>

  <!-- face -->
  <circle cx="150" cy="218" r="46" fill="#f6f3ec" stroke="#0a1a33" stroke-width="2"/>
  <path d="M126 210 q8 -9 16 0" fill="none" stroke="#0a1a33" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M158 210 q8 -9 16 0" fill="none" stroke="#0a1a33" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M124 224 l7 11 -7 11 -7 -11z" fill="#ef0107"/>
  <circle cx="178" cy="233" r="6" fill="#ef0107" opacity=".85"/>
  <circle cx="150" cy="226" r="5.5" fill="#ef0107"/>
  <path d="M129 242 q21 26 42 0 z" fill="#0a1a33"/>
  <path d="M138 243 q12 8 24 0" fill="none" stroke="#f6f3ec" stroke-width="3" stroke-linecap="round"/>

  <!-- camera -->
  <g stroke="#f6f3ec" stroke-width="3" fill="#0a1a33" stroke-linejoin="round">
    <rect x="24" y="140" width="40" height="28" rx="5"/>
    <rect x="36" y="133" width="14" height="8" rx="2"/>
    <circle cx="44" cy="154" r="8.5"/>
  </g>
  <!-- code -->
  <text x="14" y="255" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#d2b06a">&lt;/&gt;</text>
  <!-- pen nib -->
  <g>
    <path d="M256 128 L272 160 L256 178 L240 160 Z" fill="#d2b06a" stroke="#0a1a33" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M256 138 V160" stroke="#0a1a33" stroke-width="2"/>
    <circle cx="256" cy="162" r="2.5" fill="#0a1a33"/>
  </g>
  <!-- shield -->
  <g>
    <path d="M266 212 L288 221 V240 C288 253 277 262 266 267 C255 262 244 253 244 240 V221 Z" fill="#0a1a33" stroke="#f6f3ec" stroke-width="3" stroke-linejoin="round"/>
    <path d="M256 240 l7 7 13 -14" fill="none" stroke="#d2b06a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- suits -->
  <g font-family="Georgia, serif" font-size="22">
    <text x="22" y="40" fill="#f6f3ec">♠</text>
    <text x="256" y="40" fill="#ef0107">♥</text>
    <text x="22" y="398" fill="#ef0107">♦</text>
    <text x="256" y="398" fill="#f6f3ec">♣</text>
  </g>
</svg>
